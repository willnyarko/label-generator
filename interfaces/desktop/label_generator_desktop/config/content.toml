# What the desktop program says: its help text and its notices. Its window shows
# the browser interface, whose wording is in label_generator/service/config/content.toml.

[desktop]
title = "Label Generator"
description = "The label generator in its own window, for Yale Special Collections staff."
browser = "Open in the default browser instead of its own window"
port = "Port to listen on, on this computer only (default: any free port)"
no_update_check = "Don't look for a newer version, even if an update address is set"
update_url = "Address of the update file (default: the LABEL_GENERATOR_UPDATE_URL environment variable)"
feedback_url = "Where the Report a problem link goes (default: the LABEL_GENERATOR_FEEDBACK_URL environment variable)"
version = "Print the version and quit"
version_line = "{title} {version}"
error = "Error: {error}"
service_missing = "The browser interface isn't installed. Install it with:  pip install -e ."
window_failed = "The window couldn't open ({reason}), so it is using your browser instead."
browser_running = "{title} is running at {url}  (close the page, or press Ctrl+C, to stop)"
update_available = "Version {latest} is available. You are running {current}."
update_link = "Get it at {url}"
update_downloading = "Downloading the new version."
update_progress = "Downloading the new version: {done} of {total} MB."
update_installing = "Checking the downloaded update."
update_restarting = "The update has been checked. Opening the new version."
update_failed = "The update could not be installed: {reason}"
update_checksum = "The downloaded file did not match its published checksum."
update_layout = "The downloaded file does not hold one application folder."
service_stopped = "The label generator stopped while starting up."
service_slow = "The label generator didn't start within {seconds} seconds."
update_digest_missing = "The update is missing a valid checksum."
update_package = "The download does not contain the expected application, platform, version, or recovery support."
update_restored = "The update did not finish. Version {version} is running again."
